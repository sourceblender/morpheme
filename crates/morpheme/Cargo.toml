[package]
name = "morpheme"
version = "0.3.0"
description = "Fast, pure-Rust subword tokenization (BPE, WordPiece, Unigram) compatible with Hugging Face tokenizers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["tokenizer", "bpe", "wordpiece", "sentencepiece", "nlp"]
categories = ["text-processing", "science"]
# Keep test data, tests and benchmarks out of the published crate; they
# need the downloaded Hugging Face fixtures anyway.
exclude = [
    "tests/",
    "benches/",
    "examples/",
    "src/pre_tokenizers/testdata/",
    "src/pre_tokenizers/tests.rs",
    "src/models/bpe/fixture_data.rs",
    "src/models/bpe/fixture_tests.rs",
    "src/trainers/bpe/parity_data.rs",
]

[lib]
# Benchmarks live in benches/ (Criterion); keep libtest's bench harness
# from receiving Criterion's command-line flags.
bench = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
unicode-normalization-alignments = { workspace = true }
unicode_categories = { workspace = true }
unicode-segmentation = { workspace = true }
fancy-regex = { workspace = true }
aho-corasick = { workspace = true }
rayon = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
indicatif = { workspace = true, optional = true }

# Atomic `Tokenizer::save` (and the `hub` cache) write through a temporary
# file. wasm32 has no usable filesystem, so the dependency and `save` are
# compiled out there; `from_bytes`/`from_json` still work in the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["progressbar", "parallel"]
# Trainer progress bars on stderr (`show_progress`), like Hugging Face.
progressbar = ["dep:indicatif"]
# Rayon-parallel `encode_batch`/`decode_batch`, batch padding and trainers.
# Without it those paths run sequentially on the calling thread, which is
# what single-threaded targets such as wasm32-unknown-unknown want.
parallel = ["dep:rayon"]
# `Tokenizer::from_pretrained`: download tokenizers from the Hugging Face Hub.
hub = ["dep:ureq", "dep:sha1", "dep:sha2"]

[dev-dependencies]
sha2 = "0.11"
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# preserve_order lets tests check that JSON field order matches HF.
serde_json = { workspace = true, features = ["preserve_order"] }

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "train"
harness = false

[[bench]]
name = "normalize"
harness = false
