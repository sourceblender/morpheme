[package]
name = "splinter"
version = "0.0.0"
description = "Fast, pure-Rust subword tokenization (BPE, WordPiece, Unigram) compatible with Hugging Face tokenizers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["tokenizer", "bpe", "wordpiece", "sentencepiece", "nlp"]
categories = ["text-processing", "science"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
unicode-normalization-alignments = { workspace = true }
unicode_categories = { workspace = true }
unicode-segmentation = { workspace = true }
fancy-regex = { workspace = true }
aho-corasick = { workspace = true }
rayon = { workspace = true }
ureq = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true

[features]
# `Tokenizer::from_pretrained`: download tokenizers from the Hugging Face Hub.
hub = ["dep:ureq"]

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
# preserve_order lets tests check that JSON field order matches HF.
serde_json = { workspace = true, features = ["preserve_order"] }
