[package]
name = "splinter"
version = "0.0.0"
description = "A Rust tokenizer library."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors = ["The splinter authors"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rustc-hash = { workspace = true }
unicode-normalization-alignments = { workspace = true }
unicode_categories = { workspace = true }
unicode-segmentation = { workspace = true }
fancy-regex = { workspace = true }
aho-corasick = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# preserve_order lets tests check that JSON field order matches HF.
serde_json = { workspace = true, features = ["preserve_order"] }
