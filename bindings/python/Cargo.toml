[package]
name = "morpheme-python"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Python bindings for the morpheme tokenizer library (built with maturin)"
publish = false

[lib]
name = "morpheme"
crate-type = ["cdylib"]
test = false
doctest = false
bench = false

[dependencies]
morpheme = { path = "../../crates/morpheme", features = ["hub"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
