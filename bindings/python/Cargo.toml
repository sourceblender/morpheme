[package]
name = "morpheme-python"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Python bindings for the morpheme tokenizer library (built with maturin)"
publish = false

[lib]
name = "morpheme"
crate-type = ["cdylib"]
test = false
doctest = false
bench = false
# The lib is named `morpheme` (the Python module name), which collides with
# the library crate's rustdoc output path; its docs are for Python anyway.
doc = false

[dependencies]
morpheme = { path = "../../crates/morpheme", features = ["hub"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
