[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "morpheme"
version = "0.3.0"
description = "Fast Hugging Face-compatible tokenizers, in Rust"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Repository = "https://github.com/sourceblender/morpheme"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "morpheme"

[tool.pytest.ini_options]
testpaths = ["tests"]
