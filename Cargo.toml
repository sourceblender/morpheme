[workspace]
resolver = "3"
members = [
    "crates/splinter",
    "apps/splinter-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sourceblender/splinter"
authors = ["The splinter authors"]
homepage = "https://github.com/sourceblender/splinter"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rustc-hash = "2"
proptest = "1"
tempfile = "3"
unicode-normalization-alignments = "0.1"
unicode_categories = "0.1"
unicode-segmentation = "1"
fancy-regex = "0.19"
aho-corasick = "1"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1