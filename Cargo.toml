[workspace]
resolver = "3"
members = [
    "crates/splinter",
    "apps/splinter-cli",
]
# cargo-fuzz targets build on nightly in their own workspace.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sourceblender/splinter"
authors = ["The splinter authors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rustc-hash = "2"
proptest = "1"
tempfile = "3"
unicode-normalization-alignments = "0.1"
unicode_categories = "0.1"
unicode-segmentation = "1"
fancy-regex = "0.19"
aho-corasick = "1"
ureq = "3"
indicatif = "0.18"
criterion = "0.7"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# Profile used by `dist` for release binaries.
[profile.dist]
inherits = "release"
