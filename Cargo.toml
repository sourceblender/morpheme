[workspace]
resolver = "2"
members = [
    "crates/splinter",
    "apps/splinter-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ericmey/splinter"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1