[workspace]
resolver = "2"
members = [
    "crates/splinter",
    "apps/splinter-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/sourceblender/splinter"
authors = ["The splinter authors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
memchr = "2"
rustc-hash = "2"
proptest = "1"
tempfile = "3"
unicode-normalization = "0.1"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1