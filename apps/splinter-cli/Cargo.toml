[package]
name = "splinter-cli"
version = "0.0.0"
description = "Command-line tool to train, inspect and run Hugging Face-compatible tokenizers with splinter."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["tokenizer", "cli", "bpe", "nlp"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "splinter"
path = "src/main.rs"
# The binary has no API to document, and its name collides with the
# library's docs.
doc = false

[features]
default = ["hub"]
# Accept Hugging Face Hub model ids wherever a tokenizer path is expected.
hub = ["splinter/hub"]

[dependencies]
splinter = { path = "../../crates/splinter", version = "0.0.0" }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }