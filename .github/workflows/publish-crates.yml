# Called by the dist release workflow (release.yml) after the release is
# planned: publishes the library, then the CLI, to crates.io.
#
# Resumable: a crate whose exact version is already on crates.io is
# skipped, so a run that failed half-way (or a re-run of a finished one)
# does not stop on "already uploaded".
name: Publish crates

on:
  workflow_call:
    inputs:
      # The dist release manifest (JSON); its announcement tag must match
      # the crate versions we are about to publish.
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Check the crate versions against the release plan
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          tag=$(jq -r '.announcement_tag // empty' <<< "$PLAN")
          echo "release plan announces: ${tag:-<no tag>}"
          for crate in morpheme morpheme-cli; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            echo "$crate $version"
            if [ -n "$tag" ] && [ "${tag#v}" != "$version" ]; then
              echo "::error::$crate is $version but the release tag is $tag"
              exit 1
            fi
          done
      - name: Publish library, then CLI (skipping versions already published)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in morpheme morpheme-cli; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            # 200 when the version exists, 404 when it doesn't; anything else
            # (rate limit, outage) must not be mistaken for "not published".
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --user-agent "$GITHUB_REPOSITORY release workflow" \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$status" in
              200) echo "$crate $version is already on crates.io; skipping"; continue ;;
              404) ;;
              *) echo "::error::crates.io returned HTTP $status for $crate $version"; exit 1 ;;
            esac
            echo "publishing $crate $version"
            cargo publish -p "$crate" --locked
          done
