name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    name: publish crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches manifest version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match crate version $VERSION"
            exit 1
          fi
      - name: Publish splinter
        run: cargo publish -p splinter --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish splinter-cli
        run: cargo publish -p splinter-cli --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binary:
    name: build binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: splinter-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: splinter-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: splinter-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: splinter-windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} -p splinter-cli
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/splinter*
            !target/${{ matrix.target }}/release/*.d

  github-release:
    name: github release
    needs: [binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true