name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [load_json, encode, normalized_string, components_json, precompiled, decode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Cache HF tokenizer fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/morpheme/tests/data
          key: hf-fixtures-${{ hashFiles('scripts/hf-fixtures.txt') }}
      - name: Fetch HF tokenizer fixtures
        run: ./scripts/fetch-hf-fixtures.sh
      - name: Install cargo-fuzz
        # Pinned so a new cargo-fuzz release cannot change a scheduled run;
        # bump deliberately (`cargo search cargo-fuzz`).
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Seed corpus
        run: python3 fuzz/make_corpus.py
      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: |
          cargo fuzz run "${{ matrix.target }}" "fuzz/corpus/${{ matrix.target }}" -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=10 -rss_limit_mb=2048
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
