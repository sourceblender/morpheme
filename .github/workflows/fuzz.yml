name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [load_json, encode, normalized_string, components_json]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Cache HF tokenizer fixtures
        uses: actions/cache@v6
        with:
          path: crates/splinter/tests/data
          key: hf-fixtures-${{ hashFiles('scripts/hf-fixtures.txt') }}
      - name: Fetch HF tokenizer fixtures
        run: ./scripts/fetch-hf-fixtures.sh
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Seed corpus
        run: python3 fuzz/make_corpus.py
      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: |
          cargo fuzz run "${{ matrix.target }}" "fuzz/corpus/${{ matrix.target }}" -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=10 -rss_limit_mb=2048
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
