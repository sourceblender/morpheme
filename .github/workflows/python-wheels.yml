name: Python wheels

# Builds abi3 (CPython >= 3.9) wheels for bindings/python plus an sdist and
# uploads them as workflow artifacts. Nothing is published: see the TODO at
# the bottom for the trusted-publishing step once a PyPI project exists.

on:
  workflow_dispatch:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: wheel (${{ matrix.platform.os }} ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          # manylinux2014's cross gcc is too old for `ring`'s aarch64 assembly
          # ("ARM assembler must define __ARM_ARCH"); 2_28 ships a modern one.
          - { os: linux, runner: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: macos, runner: macos-13, target: x86_64, manylinux: "" }
          - { os: macos, runner: macos-latest, target: aarch64, manylinux: "" }
          - { os: windows, runner: windows-latest, target: x64, manylinux: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist
          sccache: "false"
          # Belt and braces for `ring` on the aarch64 cross toolchain.
          before-script-linux: |
            if [ "${{ matrix.platform.target }}" = "aarch64" ]; then
              export CFLAGS_aarch64_unknown_linux_gnu="-D__ARM_ARCH=8"
            fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: List distributions
        run: ls -l dist
      # Token auth for now (PYPI_API_TOKEN repo secret). Switch to trusted
      # publishing (id-token: write, no password) once the PyPI project has
      # this repository + workflow registered as a trusted publisher.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true
