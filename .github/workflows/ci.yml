name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: clippy (library, no default features)
        run: cargo clippy -p morpheme --all-targets --no-default-features --locked -- -D warnings

  test:
    name: test (stable)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache HF tokenizer fixtures
        uses: actions/cache@v6
        with:
          path: crates/morpheme/tests/data
          key: hf-fixtures-${{ hashFiles('scripts/hf-fixtures.txt') }}
      - name: Fetch HF tokenizer fixtures
        shell: bash
        run: ./scripts/fetch-hf-fixtures.sh
      - run: cargo test --workspace --locked --all-features

  msrv:
    name: test (MSRV ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Cache HF tokenizer fixtures
        uses: actions/cache@v6
        with:
          path: crates/morpheme/tests/data
          key: hf-fixtures-${{ hashFiles('scripts/hf-fixtures.txt') }}
      - name: Fetch HF tokenizer fixtures
        shell: bash
        run: ./scripts/fetch-hf-fixtures.sh
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  benches:
    # Compile (don't run) the Criterion suite so it can't rot.
    name: benches compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run --workspace --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Cache HF tokenizer fixtures
        uses: actions/cache@v6
        with:
          path: crates/morpheme/tests/data
          key: hf-fixtures-${{ hashFiles('scripts/hf-fixtures.txt') }}
      - name: Fetch HF tokenizer fixtures
        shell: bash
        run: ./scripts/fetch-hf-fixtures.sh
      - name: Test with coverage
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked --all-features

  hub:
    # Downloads from the Hugging Face Hub (ignored in the regular test run).
    name: hub downloads (network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache HF tokenizer fixtures
        uses: actions/cache@v6
        with:
          path: crates/morpheme/tests/data
          key: hf-fixtures-${{ hashFiles('scripts/hf-fixtures.txt') }}
      - name: Fetch HF tokenizer fixtures
        run: ./scripts/fetch-hf-fixtures.sh
      - run: cargo test -p morpheme --features hub --test hub --locked -- --ignored

  python-interop:
    name: interop with Python tokenizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install tokenizers==0.23.2
      - run: python scripts/check_python_interop.py

  deny:
    # Licenses, bans, sources and RustSec advisories (deny.toml).
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
