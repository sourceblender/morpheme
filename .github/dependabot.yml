version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # criterion 0.8 requires Rust 1.86; our MSRV is 1.85 (CI's MSRV job
      # builds dev-dependencies). Lift this when the MSRV moves past 1.86.
      - dependency-name: "criterion"
        versions: [">=0.8.0"]

  # The fuzz crate is a separate workspace with its own lockfile.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      fuzz:
        patterns: ["*"]

  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot
  # updates both. This includes the dist-generated release.yml (pinned by
  # hand; see the note at its top and `allow-dirty` in dist-workspace.toml).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
